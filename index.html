<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karkötőim</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffaf7;color:#241b18;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:auto;padding:16px 12px 42px}.hero{text-align:center;padding:34px 0 25px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#a85f48;font-weight:800}
h1{font-family:Georgia,serif;font-size:clamp(42px,9vw,68px);margin:8px 0}.hero p{color:#7c6b63;line-height:1.6}
.social{display:inline-block;margin-top:14px;padding:10px 15px;border:1px solid #eaded7;border-radius:999px;color:#241b18;text-decoration:none;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #eaded7;border-radius:20px;overflow:hidden;box-shadow:0 10px 26px rgba(55,35,25,.06)}
.photo{aspect-ratio:4/3;background:#f7efe9}.photo img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:15px}.name{font-family:Georgia,serif;font-size:21px;margin:0 0 7px}.desc{font-size:13px;color:#7c6b63;line-height:1.5;min-height:40px}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.price{font-weight:800}
.btn{background:#a85f48;color:white;text-decoration:none;padding:10px 13px;border-radius:11px;font-weight:800;font-size:13px}
.editor{margin:0 auto 24px;background:#fff;border:1px solid #eaded7;border-radius:20px;padding:17px}.editor summary{cursor:pointer;font-weight:800;font-size:18px}
.note{color:#7c6b63;font-size:13px;line-height:1.5}.item{padding:12px 0;border-bottom:1px solid #eaded7}
input,textarea{width:100%;margin-top:7px;padding:10px;border:1px solid #eaded7;border-radius:9px;font:inherit}
button{margin:12px 6px 0 0;padding:10px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}#save{background:#a85f48;color:#fff}
footer{margin-top:28px;padding-top:18px;border-top:1px solid #eaded7;text-align:center;color:#7c6b63;font-size:13px}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr;gap:11px}.info{padding:12px}.name{font-size:18px}.bottom{flex-direction:column;align-items:stretch}.btn{text-align:center}}
</style></head>
<body><div class="wrap">
<section class="hero"><div class="eyebrow">Kézzel készített darabok</div><h1>Karkötőim ♡</h1>
<p>Válaszd ki a kedvencedet, nézd meg a részleteket, és nyisd meg a Marketplace-hirdetést.</p>
<a class="social" href="#" target="_blank" rel="noopener">Instagram · @sajatneved</a></section>
<section class="grid" id="grid"></section><footer>Kérdésed van? Írj üzenetet Instagramon. ♡</footer></div>
<script>
const defaults=[{"name": "Űrhajós karkötő", "price": "", "desc": "Lávakő gyöngyökből készült, holdon ülő űrhajós charm díszítéssel.", "link": "https://www.facebook.com/marketplace/item/1641787224111191/", "image": "karkoto_1.jpg"}, {"name": "Sellő farkú karkötő", "price": "", "desc": "Elegáns gyöngyök és sellőfarok charm – különleges, nőies darab.", "link": "https://www.facebook.com/marketplace/item/3149470178582107/", "image": "karkoto_2.jpg"}, {"name": "Méhecskés karkötő", "price": "", "desc": "Vidám fekete-narancs színek, méhecske és mézes charm.", "link": "https://www.facebook.com/marketplace/item/2514420662416186/", "image": "karkoto_3.jpg"}, {"name": "Rózsaszín karkötő", "price": "", "desc": "Rózsaszín gyöngyök és csillogó részletek, egy kis bájjal.", "link": "https://www.facebook.com/marketplace/item/2054052425228081/", "image": "karkoto_4.jpg"}, {"name": "Holdas karkötő", "price": "", "desc": "Kék és lila gyöngyök – egyszerű, letisztult karkötő charm nélkül.", "link": "https://www.facebook.com/marketplace/item/2514420662416186/", "image": "karkoto_5.jpg"}, {"name": "Gyöngyös karkötő", "price": "", "desc": "Klasszikus gyöngyök modern formában, időtálló elegancia.", "link": "https://www.facebook.com/marketplace/item/1846205529915962/", "image": "karkoto_6.jpg"}, {"name": "Piros karkötő", "price": "", "desc": "Élénk piros gyöngyök és kereszt charm – erőt sugárzó darab.", "link": "https://www.facebook.com/marketplace/item/29334094506198131/", "image": "karkoto_7.jpg"}, {"name": "Kék karkötő", "price": "", "desc": "Nyugtató kék árnyalatok, természetes stílus, charm nélkül.", "link": "https://www.facebook.com/marketplace/item/930601496495402/", "image": "karkoto_8.jpg"}, {"name": "Cica karkötő", "price": "", "desc": "Meleg barna színek és cica charm – a mindennapok kedvence.", "link": "https://www.facebook.com/marketplace/item/1654930699671974/", "image": "karkoto_9.jpg"}];
let products=defaults;try{const s=JSON.parse(localStorage.getItem("karkotoim_final")||"null");if(s?.products)products=s.products}catch(e){}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function render(){
grid.innerHTML=products.map(p=>`<article class="card"><div class="photo"><img src="${p.image}" alt="${esc(p.name)}"></div><div class="info"><h2 class="name">${esc(p.name)}</h2><div class="desc">${esc(p.desc)}</div><div class="bottom"><span class="price">${esc(p.price||"Ár megadása")}</span><a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">Megnézem →</a></div></div></article>`).join("");
edit.innerHTML=products.map((p,i)=>`<div class="item"><b>${i+1}. karkötő</b><input data-i="${i}" data-k="name" value="${esc(p.name)}" placeholder="Név"><input data-i="${i}" data-k="price" value="${esc(p.price)}" placeholder="Ár"><input data-i="${i}" data-k="link" value="${esc(p.link)}" placeholder="Marketplace-link"><textarea data-i="${i}" data-k="desc" rows="2">${esc(p.desc)}</textarea></div>`).join("");
}render();
save.onclick=()=>{const next=products.map((p,i)=>{const q={...p};document.querySelectorAll(`[data-i="${i}"]`).forEach(e=>q[e.dataset.k]=e.value);return q});localStorage.setItem("karkotoim_final",JSON.stringify({products:next}));location.reload()};
reset.onclick=()=>{localStorage.removeItem("karkotoim_final");location.reload()};
</script></body></html>
